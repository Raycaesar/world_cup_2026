name: Publish knockout predictions

on:
  workflow_dispatch:
  schedule:
    # 18:00 Beijing time = 10:00 UTC
    - cron: "0 10 * * *"

permissions:
  contents: write

concurrency:
  group: publish-knockout-predictions
  cancel-in-progress: false

jobs:
  publish-predictions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check publisher syntax
        run: node --check scripts/publish_predictions.js

      - name: Publish due predictions
        env:
          DATA_PATH: data.json
          UPDATE_LOG_LIMIT: 24
        run: node scripts/publish_predictions.js

      - name: Validate data.json
        run: |
          node -e 'JSON.parse(require("fs").readFileSync("data.json", "utf8")); console.log("data.json OK")'

      - name: Commit changes if needed
        run: |
          if git diff --quiet data.json; then
            echo "No prediction releases."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "publish scheduled knockout predictions"
          git pull --rebase origin main
          git push
